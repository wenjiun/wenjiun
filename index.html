<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argon WebXR Pavilion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #030712;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f3f4f6;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #14b8a6;
      box-shadow: 0 0 10px #14b8a6;
    }
    .hud-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .card-grid {
      display: flex;
      gap: 16px;
      max-width: 840px;
      width: 100%;
    }
    .info-card {
      flex: 1;
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      font-size: 13px;
      line-height: 1.5;
    }
    .info-card h4 {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-card strong {
      color: #f8fafc;
    }
    #vr-button {
      pointer-events: auto;
      cursor: pointer;
      padding: 14px 36px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    #vr-button:hover:not(:disabled) {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    #vr-button:disabled {
      background: rgba(30, 41, 59, 0.6);
      border-color: rgba(255, 255, 255, 0.05);
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }
    #blocker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 5;
      cursor: pointer;
    }
    #instructions {
      font-size: 18px;
      color: #e2e8f0;
      background: rgba(15, 23, 42, 0.85);
      padding: 16px 28px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="blocker">
    <div id="instructions">Click anywhere to look and walk with WASD</div>
  </div>

  <div id="ui-layer">
    <div class="hud-header">
      <div class="badge">
        <span class="badge-dot"></span>
        Argon WebXR Pavilion
      </div>
      <div id="fps-meter" class="badge">FPS: 60</div>
    </div>

    <div class="hud-footer">
      <div class="card-grid">
        <div class="info-card">
          <h4>Desktop Mode</h4>
          Click screen to lock mouse. Walk with <strong>W A S D</strong>, sprint with <strong>Shift</strong>.
        </div>
        <div class="info-card">
          <h4>Quest 3S VR Controls</h4>
          <strong>Left Thumbstick:</strong> Smooth Locomotion & Strafe<br />
          <strong>Right Thumbstick:</strong> 45° Snap Turn
        </div>
      </div>
      <button id="vr-button" disabled>Checking VR...</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, cameraDolly;
    let vrControllers = [];
    let centralArtifact, ringMesh;
    const clock = new THREE.Clock();

    // Desktop controls
    let isLocked = false;
    const moveState = { forward: false, backward: false, left: false, right: false, sprint: false };
    let euler = new THREE.Euler(0, 0, 0, 'YXZ');

    // VR snap turn debounce
    let snapTurnCooldown = 0;

    init();
    setupWebXR();
    animate();

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060913);
      scene.fog = new THREE.FogExp2(0x060913, 0.025);

      // 2. Camera & Dolly Rig
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
      cameraDolly = new THREE.Group();
      
      // Starting position elevated and stepped back
      cameraDolly.position.set(0, 1.8, 10);
      cameraDolly.add(camera);
      scene.add(cameraDolly);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      // 4. Lighting
      const ambientLight = new THREE.AmbientLight(0x273549, 1.2);
      scene.add(ambientLight);

      const centerPointLight = new THREE.PointLight(0x38bdf8, 3, 25);
      centerPointLight.position.set(0, 3, 0);
      scene.add(centerPointLight);

      const dirLight = new THREE.DirectionalLight(0x93c5fd, 1.5);
      dirLight.position.set(10, 20, 8);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0001;
      scene.add(dirLight);

      // 5. Build Environment
      buildWorld();

      // 6. Event Listeners
      window.addEventListener('resize', onWindowResize, false);
      setupDesktopControls();
    }

    function buildWorld() {
      // Main Floor (Positioned cleanly at y = 0)
      const floorGeo = new THREE.CylinderGeometry(18, 18, 0.4, 64);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        roughness: 0.4,
        metalness: 0.6,
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.y = -0.2; // Sit level with ground
      floor.receiveShadow = true;
      scene.add(floor);

      // Central pediment
      const pedimentGeo = new THREE.CylinderGeometry(4, 4.4, 0.6, 48);
      const pedimentMat = new THREE.MeshStandardMaterial({
        color: 0x1e293b,
        roughness: 0.5,
        metalness: 0.5
      });
      const pediment = new THREE.Mesh(pedimentGeo, pedimentMat);
      pediment.position.y = 0.3;
      pediment.receiveShadow = true;
      scene.add(pediment);

      // Surrounding Columns
      const columnCount = 10;
      const radius = 14;
      const colGeo = new THREE.CylinderGeometry(0.5, 0.6, 9, 32);
      const colMat = new THREE.MeshStandardMaterial({
        color: 0x111c30,
        roughness: 0.3,
        metalness: 0.8
      });

      for (let i = 0; i < columnCount; i++) {
        const angle = (i / columnCount) * Math.PI * 2;
        const col = new THREE.Mesh(colGeo, colMat);
        col.position.set(Math.cos(angle) * radius, 4.5, Math.sin(angle) * radius);
        col.castShadow = true;
        col.receiveShadow = true;
        scene.add(col);
      }

      // Central Floating Artifact
      const icoGeo = new THREE.IcosahedronGeometry(1.2, 1);
      const icoMat = new THREE.MeshStandardMaterial({
        color: 0x0284c7,
        roughness: 0.1,
        metalness: 0.9,
        flatShading: true
      });
      centralArtifact = new THREE.Mesh(icoGeo, icoMat);
      centralArtifact.position.set(0, 3, 0);
      centralArtifact.castShadow = true;
      scene.add(centralArtifact);

      // Wireframe cage around artifact
      const ringGeo = new THREE.IcosahedronGeometry(2.0, 2);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        wireframe: true,
        transparent: true,
        opacity: 0.4
      });
      ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.position.set(0, 3, 0);
      scene.add(ringMesh);

      // Floating dust particles
      const starGeo = new THREE.BufferGeometry();
      const count = 300;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 30;
        positions[i + 1] = Math.random() * 8;
        positions[i + 2] = (Math.random() - 0.5) * 30;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({ color: 0x67e8f9, size: 0.06 });
      const stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);
    }

    function setupDesktopControls() {
      const blocker = document.getElementById('blocker');

      document.body.addEventListener('click', () => {
        if (!renderer.xr.isPresenting && !isLocked) {
          document.body.requestPointerLock();
        }
      });

      document.addEventListener('pointerlockchange', () => {
        isLocked = document.pointerLockElement === document.body;
        blocker.style.display = isLocked ? 'none' : 'flex';
      });

      document.addEventListener('mousemove', (event) => {
        if (!isLocked || renderer.xr.isPresenting) return;
        euler.setFromQuaternion(camera.quaternion);
        euler.y -= event.movementX * 0.0022;
        euler.x -= event.movementY * 0.0022;
        euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, euler.x));
        camera.quaternion.setFromEuler(euler);
      });

      const onKey = (val) => (e) => {
        switch (e.code) {
          case 'KeyW': moveState.forward = val; break;
          case 'KeyS': moveState.backward = val; break;
          case 'KeyA': moveState.left = val; break;
          case 'KeyD': moveState.right = val; break;
          case 'ShiftLeft':
          case 'ShiftRight': moveState.sprint = val; break;
        }
      };
      window.addEventListener('keydown', onKey(true));
      window.addEventListener('keyup', onKey(false));
    }

    function setupWebXR() {
      const btn = document.getElementById('vr-button');

      if (!navigator.xr) {
        btn.textContent = 'VR NOT SUPPORTED';
        return;
      }

      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        if (supported) {
          btn.disabled = false;
          btn.textContent = 'ENTER VR';

          btn.addEventListener('click', async () => {
            if (!renderer.xr.isPresenting) {
              const session = await navigator.xr.requestSession('immersive-vr', {
                optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
              });
              renderer.xr.setSession(session);
              btn.textContent = 'EXIT VR';

              session.addEventListener('end', () => {
                btn.textContent = 'ENTER VR';
              });
            } else {
              renderer.xr.getSession().end();
            }
          });
        } else {
          btn.textContent = 'VR NOT SUPPORTED';
        }
      });

      // Controller laser rays
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        cameraDolly.add(controller);

        const rayGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0, -1.5)
        ]);
        const rayMat = new THREE.LineBasicMaterial({ color: 0x38bdf8 });
        controller.add(new THREE.Line(rayGeo, rayMat));
        vrControllers.push(controller);
      }
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function updateLocomotion(delta) {
      if (renderer.xr.isPresenting) {
        // VR Controller Locomotion
        const session = renderer.xr.getSession();
        if (!session) return;

        snapTurnCooldown -= delta;

        session.inputSources.forEach((source) => {
          if (!source.gamepad || !source.gamepad.axes) return;

          const axes = source.gamepad.axes;
          const xAxis = axes[2] !== undefined ? axes[2] : axes[0];
          const yAxis = axes[3] !== undefined ? axes[3] : axes[1];

          // Left Hand: Smooth Walk
          if (source.handedness === 'left') {
            if (Math.hypot(xAxis, yAxis) > 0.15) {
              const speed = 3.5 * delta;
              const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
              forward.y = 0;
              forward.normalize();

              const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
              side.y = 0;
              side.normalize();

              cameraDolly.position.addScaledVector(forward, -yAxis * speed);
              cameraDolly.position.addScaledVector(side, xAxis * speed);
            }
          }

          // Right Hand: 45° Snap Turn
          if (source.handedness === 'right') {
            if (Math.abs(xAxis) > 0.6 && snapTurnCooldown <= 0) {
              const angle = xAxis > 0 ? -Math.PI / 4 : Math.PI / 4;
              cameraDolly.rotateY(angle);
              snapTurnCooldown = 0.35;
            }
          }
        });
      } else if (isLocked) {
        // Desktop WASD movement
        const speed = (moveState.sprint ? 7.0 : 3.5) * delta;
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        forward.y = 0;
        forward.normalize();

        const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        side.y = 0;
        side.normalize();

        if (moveState.forward) cameraDolly.position.addScaledVector(forward, speed);
        if (moveState.backward) cameraDolly.position.addScaledVector(forward, -speed);
        if (moveState.left) cameraDolly.position.addScaledVector(side, -speed);
        if (moveState.right) cameraDolly.position.addScaledVector(side, speed);
      }
    }

    function animate() {
      renderer.setAnimationLoop(() => {
        const delta = clock.getDelta();
        const elapsed = clock.getElapsedTime();

        // Animate central artifact
        if (centralArtifact && ringMesh) {
          centralArtifact.rotation.y = elapsed * 0.4;
          centralArtifact.rotation.x = elapsed * 0.2;
          centralArtifact.position.y = 3 + Math.sin(elapsed * 1.5) * 0.15;

          ringMesh.rotation.y = -elapsed * 0.2;
          ringMesh.rotation.z = elapsed * 0.1;
          ringMesh.position.y = centralArtifact.position.y;
        }

        updateLocomotion(delta);
        renderer.render(scene, camera);
      });
    }
  </script>
</body>
</html>
