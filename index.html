<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argon WebXR Pavilion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #030712;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f3f4f6;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #14b8a6;
      box-shadow: 0 0 10px #14b8a6;
    }
    .hud-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .card-grid {
      display: flex;
      gap: 16px;
      max-width: 840px;
      width: 100%;
    }
    .info-card {
      flex: 1;
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      font-size: 13px;
      line-height: 1.5;
    }
    .info-card h4 {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-card strong {
      color: #f8fafc;
    }
    #vr-button {
      pointer-events: auto;
      cursor: pointer;
      padding: 14px 36px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    #vr-button:hover:not(:disabled) {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    #vr-button:disabled {
      background: rgba(30, 41, 59, 0.6);
      border-color: rgba(255, 255, 255, 0.05);
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }
    #blocker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 5;
      cursor: pointer;
    }
    #instructions {
      font-size: 18px;
      color: #e2e8f0;
      background: rgba(15, 23, 42, 0.85);
      padding: 16px 28px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="blocker">
    <div id="instructions">Click anywhere to look and walk with WASD</div>
  </div>

  <div id="ui-layer">
    <div class="hud-header">
      <div class="badge">
        <span class="badge-dot"></span>
        Argon WebXR Pavilion
      </div>
      <div id="fps-meter" class="badge">FPS: 60</div>
    </div>

    <div class="hud-footer">
      <div class="card-grid">
        <div class="info-card">
          <h4>Desktop Mode</h4>
          Click screen to lock mouse. Walk with <strong>W A S D</strong>, sprint with <strong>Shift</strong>.
        </div>
        <div class="info-card">
          <h4>Quest 3S VR Controls</h4>
          <strong>Left Thumbstick:</strong> Smooth Locomotion & Strafe<br />
          <strong>Right Thumbstick:</strong> 45° Snap Turn
        </div>
      </div>
      <button id="vr-button" disabled>Checking VR...</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, cameraDolly;
    let vrControllers = [];
    let centralArtifact, ringMesh;
    const clock = new THREE.Clock();

    // Desktop controls
    let isLocked = false;
    const moveState = { forward: false, backward: false, left: false, right: false, sprint: false };
    let euler = new THREE.Euler(0, 0, 0, 'YXZ');

    // VR snap turn debounce
    let snapTurnCooldown = 0;

    init();
    setupWebXR();
    animate();

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060913);
      scene.fog = new THREE.FogExp2(0x060913, 0.025);

      // 2. Camera & Dolly Rig
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
      cameraDolly = new THREE.Group();
      
      // Starting position elevated and stepped back
      cameraDolly.position.set(0, 1.8, 10);
      cameraDolly.add(camera);
      scene.add(cameraDolly);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      // 4. Lighting
      const ambientLight = new THREE.AmbientLight(0x273549, 1.2);
      scene.add(ambientLight);

      const centerPointLight = new THREE.PointLight(0x38bdf8, 3, 25);
      centerPointLight.position.set(0, 3, 0);
      scene.add(centerPointLight);

      const dirLight = new THREE.DirectionalLight(0x93c5fd, 1.5);
      dir
