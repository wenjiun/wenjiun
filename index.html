<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist WebXR Walkable World</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- WebXR VRButton -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #05070f;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* Style VR Button provided by Three.js VRButton helper */
    #VRButton {
      position: absolute !important;
      bottom: 24px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      padding: 12px 28px !important;
      border: 1px solid rgba(59, 130, 246, 0.4) !important;
      border-radius: 9999px !important;
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.8), rgba(79, 70, 229, 0.8)) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      color: #fff !important;
      font-weight: 600 !important;
      letter-spacing: 0.05em !important;
      font-size: 14px !important;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5) !important;
      transition: all 0.25s ease !important;
      z-index: 100 !important;
      cursor: pointer !important;
    }
    #VRButton:hover {
      box-shadow: 0 14px 30px -4px rgba(99, 102, 241, 0.7) !important;
      transform: translateX(-50%) scale(1.04) !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased overflow-hidden">

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Non-VR Instruction / UI Overlay -->
  <div id="hud-overlay" class="absolute inset-0 pointer-events-none z-10 flex flex-col justify-between p-6">
    <!-- Header bar -->
    <header class="flex items-center justify-between w-full max-w-5xl mx-auto">
      <div class="flex items-center space-x-3 bg-slate-900/60 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-slate-700/50 shadow-lg pointer-events-auto">
        <div class="h-3 w-3 rounded-full bg-cyan-400 animate-pulse"></div>
        <h1 class="text-sm font-semibold tracking-wide text-slate-200 uppercase">Argon WebXR Pavilion</h1>
      </div>

      <!-- Live Diagnostics / Stats badge -->
      <div class="flex items-center space-x-2 bg-slate-900/60 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-slate-700/50 text-xs font-mono text-slate-400">
        <span>FPS:</span>
        <span id="fps-counter" class="text-emerald-400 font-bold">60</span>
        <span class="mx-1 text-slate-600">|</span>
        <span id="xr-status-label" class="text-indigo-300">Desktop Mode</span>
      </div>
    </header>

    <!-- Center Crosshair for Desktop Lock -->
    <div id="crosshair" class="hidden self-center justify-center items-center pointer-events-none">
      <div class="w-2 h-2 rounded-full border border-cyan-400/80 bg-cyan-300/40"></div>
    </div>

    <!-- Controls Panel & Footer -->
    <footer class="w-full max-w-4xl mx-auto pb-16 flex flex-col sm:flex-row items-center justify-between gap-4">
      <!-- Desktop Instructions Card -->
      <div id="desktop-instructions" class="pointer-events-auto bg-slate-900/75 backdrop-blur-md p-4 rounded-2xl border border-slate-800/80 shadow-2xl flex items-center space-x-4 max-w-md w-full">
        <div class="flex flex-col items-center justify-center p-2 rounded-xl bg-slate-800/80 border border-slate-700/50 text-cyan-400 shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
          </svg>
        </div>
        <div class="text-xs">
          <div class="font-semibold text-slate-200 mb-0.5">Desktop Controls</div>
          <div class="text-slate-400">
            Click screen to lock cursor • <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-200 font-mono">W A S D</kbd> to walk • <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-200 font-mono">Shift</kbd> to sprint
          </div>
        </div>
      </div>

      <!-- VR Headset Instructions Card -->
      <div class="pointer-events-auto bg-slate-900/75 backdrop-blur-md p-4 rounded-2xl border border-slate-800/80 shadow-2xl flex items-center space-x-4 max-w-md w-full">
        <div class="flex flex-col items-center justify-center p-2 rounded-xl bg-slate-800/80 border border-slate-700/50 text-indigo-400 shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
        </div>
        <div class="text-xs">
          <div class="font-semibold text-slate-200 mb-0.5">VR Headset Controls</div>
          <div class="text-slate-400">
            <span class="text-indigo-300 font-medium">Left Thumbstick:</span> Smooth move/strafe<br>
            <span class="text-indigo-300 font-medium">Right Thumbstick:</span> 45° Snap-turning
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script>
    /* ==========================================================================
       1. GLOBAL ENGINE STATE & SETUP
       ========================================================================== */
    const container = document.getElementById('canvas-container');
    const fpsLabel = document.getElementById('fps-counter');
    const xrStatusLabel = document.getElementById('xr-status-label');
    const crosshair = document.getElementById('crosshair');

    let scene, camera, renderer;
    let cameraDolly; // Crucial for WebXR smooth locomotion / rotation offset
    let clock = new THREE.Clock();

    // Locomotion parameters
    const WALK_SPEED = 3.6; // meters/second
    const SPRINT_MULTIPLIER = 1.8;
    const SNAP_ANGLE = Math.PI / 4; // 45 degrees
    let canSnapTurn = true; // Debounce for thumbstick snap turn

    // Desktop controls state
    const moveState = { forward: false, backward: false, left: false, right: false, sprint: false };
    let isPointerLocked = false;
    let pitch = 0;
    let yaw = 0;

    // VR Controllers
    let controller1, controller2;
    let controllerGrip1, controllerGrip2;

    // Interactive animated meshes
    const animatedMonoliths = [];
    let particleSystem;

    // Performance & FPS calculation
    let frameCount = 0;
    let lastFpsTime = performance.now();

    /* ==========================================================================
       2. INITIALIZATION ROUTINE
       ========================================================================== */
    window.onload = function() {
      initScene();
      initLighting();
      initEnvironment();
      initFloatingSculptures();
      initParticles();
      initDesktopControls();
      initWebXR();

      window.addEventListener('resize', onWindowResize, false);

      // Start the core WebXR-compatible animation loop
      renderer.setAnimationLoop(renderLoop);
    };

    function initScene() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060913);
      scene.fog = new THREE.FogExp2(0x060913, 0.022);

      // Camera
      const camera = new THREE.PerspectiveCamera(
	  70, // or 75
	  window.innerWidth / window.innerHeight,
 	  0.1, // Change near clipping plane to 0.05 or keep small
	  1000
      );

      // Camera Dolly (WebXR Rig): The camera is child to the dolly.
      // Modifying dolly.position moves the player without interfering with head tracking.
      cameraDolly = new THREE.Group();
      // Raise the starting position so the camera looks over the courtyard
      cameraDolly.position.set(0, 1.8, 12); // Lift Y to ~1.8m (eye level) and pull back Z to ~12m
      cameraDolly.add(camera);
      scene.add(cameraDolly);

      // Renderer with WebXR support & tone mapping
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;

      // Crucial for WebXR rendering
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);
    }

    /* ==========================================================================
       3. PROCEDURAL ENVIRONMENT & LIGHTING
       ========================================================================== */
    function initLighting() {
      // Ambient illumination
      const ambientLight = new THREE.AmbientLight(0x1a243b, 1.2);
      scene.add(ambientLight);

      // Primary Directional Light (Simulating moon / distant cyan sun)
      const dirLight = new THREE.DirectionalLight(0xdbeafe, 1.8);
      dirLight.position.set(18, 28, 12);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 60;
      dirLight.shadow.camera.left = -25;
      dirLight.shadow.camera.right = 25;
      dirLight.shadow.camera.top = 25;
      dirLight.shadow.camera.bottom = -25;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      // Subtle warm accent lights around the courtyard
      const accentPositions = [
        [-8, 1.5, -8, 0x06b6d4], // Cyan
        [8, 1.5, -8, 0x818cf8],  // Indigo
        [-8, 1.5, 8, 0x3b82f6],  // Blue
        [8, 1.5, 8, 0xc084fc]    // Purple
      ];

      accentPositions.forEach(([x, y, z, color]) => {
        const point = new THREE.PointLight(color, 2.5, 14, 2);
        point.position.set(x, y, z);
        scene.add(point);

        // Visual lamp anchor
        const lampGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const lampMat = new THREE.MeshBasicMaterial({ color: color });
        const lampMesh = new THREE.Mesh(lampGeo, lampMat);
        lampMesh.position.set(x, y, z);
        scene.add(lampMesh);
      });
    }

    function initEnvironment() {
      // 1. Procedural Grid Courtyard Ground
      const floorSize = 64;
      const floorGeo = new THREE.PlaneGeometry(floorSize, floorSize, 64, 64);
      floorGeo.rotateX(-Math.PI / 2);

      // Procedural canvas grid texture
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 1024, 1024);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      const step = 64;
      for (let x = 0; x <= 1024; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1024);
        ctx.stroke();
      }
      for (let y = 0; y <= 1024; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1024, y);
        ctx.stroke();
      }
      // Glowing inner accent border
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 6;
      ctx.strokeRect(32, 32, 960, 960);

      const floorTexture = new THREE.CanvasTexture(canvas);
      floorTexture.wrapS = THREE.RepeatWrapping;
      floorTexture.wrapT = THREE.RepeatWrapping;
      floorTexture.repeat.set(4, 4);

      const floorMat = new THREE.MeshStandardMaterial({
        map: floorTexture,
        roughness: 0.35,
        metalness: 0.2
      });

      const floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.receiveShadow = true;
      floorMesh.position.y = -0.5; // or groundMesh.position.y = -0.5
      scene.add(floorMesh);

      // 2. Minimalist Architectural Columns (Symmetric colonnade)
      const columnGeo = new THREE.CylinderGeometry(0.5, 0.65, 8, 24);
      const columnMat = new THREE.MeshStandardMaterial({
        color: 0x1e293b,
        roughness: 0.4,
        metalness: 0.5
      });

      const capitalGeo = new THREE.BoxGeometry(1.6, 0.4, 1.6);
      const capitalMat = new THREE.MeshStandardMaterial({
        color: 0x334155,
        roughness: 0.2,
        metalness: 0.8
      });

      const colSpacingX = 14;
      const colZPositions = [-18, -10, -2, 6, 14];

      colZPositions.forEach(z => {
        [-colSpacingX, colSpacingX].forEach(x => {
          const col = new THREE.Mesh(columnGeo, columnMat);
          col.position.set(x, 4, z);
          col.castShadow = true;
          col.receiveShadow = true;

          const cap = new THREE.Mesh(capitalGeo, capitalMat);
          cap.position.set(x, 8.1, z);
          cap.castShadow = true;

          scene.add(col);
          scene.add(cap);
        });
      });

      // 3. Central Monumental Raised Platform
      const platformGeo = new THREE.CylinderGeometry(5.5, 6.2, 0.6, 32);
      const platformMat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        roughness: 0.25,
        metalness: 0.6
      });
      const platform = new THREE.Mesh(platformGeo, platformMat);
      platform.position.set(0, 0.3, 0);
      platform.receiveShadow = true;
      platform.castShadow = true;
      scene.add(platform);

      // Glowing circular inlay on the platform
      const ringGeo = new THREE.RingGeometry(3.6, 3.85, 48);
      ringGeo.rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        side: THREE.DoubleSide
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.set(0, 0.61, 0);
      scene.add(ring);
    }

    function initFloatingSculptures() {
      // 1. Central Kinetic Icosahedron with Wireframe Crown
      const coreGroup = new THREE.Group();
      coreGroup.position.set(0, 3.0, 0);

      const icoGeo = new THREE.IcosahedronGeometry(1.4, 0);
      const icoMat = new THREE.MeshStandardMaterial({
        color: 0x3b82f6,
        roughness: 0.1,
        metalness: 0.9,
        emissive: 0x1d4ed8,
        emissiveIntensity: 0.3
      });
      const icoMesh = new THREE.Mesh(icoGeo, icoMat);
      icoMesh.castShadow = true;
      coreGroup.add(icoMesh);

      const wireGeo = new THREE.IcosahedronGeometry(1.85, 1);
      const wireMat = new THREE.MeshBasicMaterial({
        color: 0x67e8f9,
        wireframe: true,
        transparent: true,
        opacity: 0.6
      });
      const wireMesh = new THREE.Mesh(wireGeo, wireMat);
      coreGroup.add(wireMesh);

      scene.add(coreGroup);

      animatedMonoliths.push({
        group: coreGroup,
        rotSpeedY: 0.6,
        rotSpeedX: 0.3,
        hoverSpeed: 1.5,
        hoverAmp: 0.2,
        baseY: 3.0
      });

      // 2. Corner Kinetic Monoliths
      const corners = [
        [-9, -9], [9, -9], [-9, 9], [9, 9]
      ];

      corners.forEach(([x, z], index) => {
        const obelisk = new THREE.Group();
        obelisk.position.set(x, 1.8, z);

        const geo = new THREE.OctahedronGeometry(0.7, 0);
        const mat = new THREE.MeshStandardMaterial({
          color: index % 2 === 0 ? 0x06b6d4 : 0x8b5cf6,
          metalness: 0.8,
          roughness: 0.2,
          emissive: index % 2 === 0 ? 0x0891b2 : 0x6d28d9,
          emissiveIntensity: 0.4
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        obelisk.add(mesh);

        scene.add(obelisk);

        animatedMonoliths.push({
          group: obelisk,
          rotSpeedY: 0.8 + index * 0.15,
          rotSpeedX: 0.4,
          hoverSpeed: 2.0 + index * 0.3,
          hoverAmp: 0.15,
          baseY: 1.8
        });
      });
    }

    function initParticles() {
      // Floating glowing motes in the courtyard
      const particleCount = 200;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 40;
        positions[i + 1] = Math.random() * 8 + 0.5;
        positions[i + 2] = (Math.random() - 0.5) * 40;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        color: 0x93c5fd,
        size: 0.08,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      });

      particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);
    }

    /* ==========================================================================
       4. DESKTOP LOCOMOTION & POINTER LOCK
       ========================================================================== */
    function initDesktopControls() {
      const domElem = renderer.domElement;

      domElem.addEventListener('click', () => {
        if (!renderer.xr.isPresenting) {
          domElem.requestPointerLock();
        }
      });

      document.addEventListener('pointerlockchange', () => {
        isPointerLocked = (document.pointerLockElement === domElem);
        if (isPointerLocked) {
          crosshair.classList.remove('hidden');
          crosshair.classList.add('flex');
        } else {
          crosshair.classList.add('hidden');
          crosshair.classList.remove('flex');
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPointerLocked || renderer.xr.isPresenting) return;

        const sensitivity = 0.0022;
        yaw -= e.movementX * sensitivity;
        pitch -= e.movementY * sensitivity;

        // Clamp vertical look angle
        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

        cameraDolly.rotation.y = yaw;
        camera.rotation.x = pitch;
      });

      window.addEventListener('keydown', (e) => {
        switch (e.code) {
          case 'KeyW': moveState.forward = true; break;
          case 'KeyS': moveState.backward = true; break;
          case 'KeyA': moveState.left = true; break;
          case 'KeyD': moveState.right = true; break;
          case 'ShiftLeft':
          case 'ShiftRight': moveState.sprint = true; break;
        }
      });

      window.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': moveState.forward = false; break;
          case 'KeyS': moveState.backward = false; break;
          case 'KeyA': moveState.left = false; break;
          case 'KeyD': moveState.right = false; break;
          case 'ShiftLeft':
          case 'ShiftRight': moveState.sprint = false; break;
        }
      });
    }

    function updateDesktopLocomotion(delta) {
      if (renderer.xr.isPresenting || !isPointerLocked) return;

      const speed = WALK_SPEED * (moveState.sprint ? SPRINT_MULTIPLIER : 1.0) * delta;
      const moveVector = new THREE.Vector3();

      if (moveState.forward) moveVector.z -= 1;
      if (moveState.backward) moveVector.z += 1;
      if (moveState.left) moveVector.x -= 1;
      if (moveState.right) moveVector.x += 1;

      if (moveVector.lengthSq() > 0) {
        moveVector.normalize();
        // Transform direction into the camera dolly's current heading
        moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraDolly.rotation.y);
        cameraDolly.position.addScaledVector(moveVector, speed);

        // Simple boundary clamp to stay within pavilion
        cameraDolly.position.x = Math.max(-28, Math.min(28, cameraDolly.position.x));
        cameraDolly.position.z = Math.max(-28, Math.min(28, cameraDolly.position.z));
      }
    }

    /* ==========================================================================
       5. WEBXR LOCOMOTION & CONTROLLER MAPPINGS
       ========================================================================== */
    function initWebXR() {
      // Create self-contained VR Button without relying on external VRButton.js
      createCustomVRButton();

      renderer.xr.addEventListener('sessionstart', () => {
        xrStatusLabel.textContent = 'WebXR Active (Immersive VR)';
        xrStatusLabel.classList.remove('text-indigo-300');
        xrStatusLabel.classList.add('text-emerald-400');
      });

      renderer.xr.addEventListener('sessionend', () => {
        xrStatusLabel.textContent = 'Desktop Mode';
        xrStatusLabel.classList.remove('text-emerald-400');
        xrStatusLabel.classList.add('text-indigo-300');
      });

      // VR Controllers Setup
      controller1 = renderer.xr.getController(0);
      cameraDolly.add(controller1);

      controller2 = renderer.xr.getController(1);
      cameraDolly.add(controller2);

      // Add visual laser ray pointers to controllers
      const laserGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -3)
      ]);
      const laserMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.6
      });

      controller1.add(new THREE.Line(laserGeo, laserMat));
      controller2.add(new THREE.Line(laserGeo.clone(), laserMat.clone()));

      // Controller grip visual proxies (Spheres representing hand centers)
      const handGeo = new THREE.SphereGeometry(0.04, 16, 16);
      const handMat = new THREE.MeshStandardMaterial({
        color: 0x64748b,
        metalness: 0.8,
        roughness: 0.2
      });

      controllerGrip1 = renderer.xr.getControllerGrip(0);
      controllerGrip1.add(new THREE.Mesh(handGeo, handMat));
      cameraDolly.add(controllerGrip1);

      controllerGrip2 = renderer.xr.getControllerGrip(1);
      controllerGrip2.add(new THREE.Mesh(handGeo.clone(), handMat.clone()));
      cameraDolly.add(controllerGrip2);
    }

    function createCustomVRButton() {
      const button = document.createElement('button');
      button.id = 'VRButton';

      if ('xr' in navigator) {
        button.textContent = 'CHECKING VR...';
        navigator.xr.isSessionSupported('immersive-vr')
          .then((supported) => {
            if (supported) {
              button.textContent = 'ENTER VR';
              button.onclick = async () => {
                const currentSession = renderer.xr.getSession();
                if (!currentSession) {
                  const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
                  try {
                    const session = await navigator.xr.requestSession('immersive-vr', sessionInit);
                    renderer.xr.setSession(session);
                    button.textContent = 'EXIT VR';
                  } catch (err) {
                    console.error('Failed to start VR session:', err);
                  }
                } else {
                  currentSession.end();
                  button.textContent = 'ENTER VR';
                }
              };
            } else {
              button.textContent = 'VR NOT SUPPORTED';
              button.style.opacity = '0.5';
              button.style.cursor = 'not-allowed';
            }
          })
          .catch(() => {
            button.textContent = 'VR NOT AVAILABLE';
            button.style.opacity = '0.5';
            button.style.cursor = 'not-allowed';
          });
      } else {
        button.textContent = 'WEBXR NOT SUPPORTED';
        button.style.opacity = '0.5';
        button.style.cursor = 'not-allowed';
      }

      document.body.appendChild(button);
    }

    function updateVRLocomotion(delta) {
      if (!renderer.xr.isPresenting) return;

      const session = renderer.xr.getSession();
      if (!session) return;

      for (const source of session.inputSources) {
        if (!source.gamepad) continue;

        const axes = source.gamepad.axes;
        // Standard WebXR Gamepad Mapping:
        // axes[2]: Thumbstick horizontal (X)
        // axes[3]: Thumbstick vertical (Y)
        const axisX = axes[2] || 0;
        const axisY = axes[3] || 0;
        const deadzone = 0.15;

        // LEFT HAND: Smooth Continuous Locomotion (Forward, Back, Strafe)
        if (source.handedness === 'left') {
          if (Math.abs(axisX) > deadzone || Math.abs(axisY) > deadzone) {
            // Get user's current Head Mounted Display (HMD) direction
            const xrCamera = renderer.xr.getCamera(camera);
            const forward = new THREE.Vector3(0, 0, -1);
            forward.applyQuaternion(xrCamera.quaternion);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3(1, 0, 0);
            right.applyQuaternion(xrCamera.quaternion);
            right.y = 0;
            right.normalize();

            // Calculate directional step
            const moveVec = new THREE.Vector3();
            moveVec.addScaledVector(forward, -axisY);
            moveVec.addScaledVector(right, axisX);

            cameraDolly.position.addScaledVector(moveVec, WALK_SPEED * delta);

            // Boundary confinement
            cameraDolly.position.x = Math.max(-28, Math.min(28, cameraDolly.position.x));
            cameraDolly.position.z = Math.max(-28, Math.min(28, cameraDolly.position.z));
          }
        }

        // RIGHT HAND: Snap-Turn (Comfort rotation)
        if (source.handedness === 'right') {
          if (Math.abs(axisX) > 0.65) {
            if (canSnapTurn) {
              const sign = axisX > 0 ? -1 : 1;
              cameraDolly.rotation.y += sign * SNAP_ANGLE;
              canSnapTurn = false; // Lock until returned to neutral
            }
          } else if (Math.abs(axisX) < 0.25) {
            canSnapTurn = true; // Reset lock
          }
        }
      }
    }

    /* ==========================================================================
       6. MAIN ANIMATION LOOP
       ========================================================================== */
    function renderLoop(timestamp, frame) {
      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      // Locomotion updates
      updateDesktopLocomotion(delta);
      updateVRLocomotion(delta);

      // Animate kinetic sculptures
      for (let i = 0; i < animatedMonoliths.length; i++) {
        const item = animatedMonoliths[i];
        item.group.rotation.y += item.rotSpeedY * delta;
        item.group.rotation.x += item.rotSpeedX * delta;
        item.group.position.y = item.baseY + Math.sin(elapsedTime * item.hoverSpeed + i) * item.hoverAmp;
      }

      // Animate ambient particles gently drifting
      if (particleSystem) {
        particleSystem.rotation.y = elapsedTime * 0.02;
      }

      // Performance stats calculation
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        fpsLabel.textContent = frameCount;
        frameCount = 0;
        lastFpsTime = now;
      }

      // Render scene
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
